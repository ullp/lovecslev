name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      # API i mobil importují @slevari/shared z dist/, proto build jako první.
      - name: Build shared
        run: npm run build --workspace=@slevari/shared

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Test
        run: npm test --workspaces --if-present

      - name: Build API
        run: npm run build --workspace=@slevari/api
