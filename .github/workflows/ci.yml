name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      # API i mobil importují @slevari/shared z dist/, proto build jako první.
      - name: Build shared
        run: npm run build --workspace=@slevari/shared

      - name: Generate Prisma client
        run: npm run db:generate --workspace=@slevari/api
        env:
          DATABASE_URL: postgresql://slevari:slevari@localhost:5432/slevari

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Test
        run: npm test --workspaces --if-present

      - name: Build API
        run: npm run build --workspace=@slevari/api

  db-verify:
    name: DB migrations & seed (embedded Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@slevari/shared
      - run: npm run build --workspace=@slevari/seed-data
      - name: Apply migrations, seed twice, verify counts
        run: npm run db:verify --workspace=@slevari/api
