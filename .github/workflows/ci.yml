name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Samostatný job = samostatný check run "Branding guard", který lze označit
  # jako required status check v branch protection.
  branding:
    name: Branding guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Přejmenování na "Lovec Slev" (@lovecslev) musí držet — viz scripts/check-branding.mjs.
      - name: Check legacy project name
        run: node scripts/check-branding.mjs

  verify:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      # API i mobil importují @lovecslev/shared z dist/, proto build jako první.
      - name: Build shared
        run: npm run build --workspace=@lovecslev/shared

      - name: Generate Prisma client
        run: npm run db:generate --workspace=@lovecslev/api
        env:
          DATABASE_URL: postgresql://lovecslev:lovecslev@localhost:5432/lovecslev

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Test
        run: npm test --workspaces --if-present

      - name: Build API
        run: npm run build --workspace=@lovecslev/api

      # Produkční build webu odhalí chyby, které dev server skryje
      # (prerender, useSearchParams, server/client hranice).
      - name: Build web
        run: npm run build --workspace=@lovecslev/web

  db-verify:
    name: DB migrations & seed (embedded Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@lovecslev/shared
      - run: npm run build --workspace=@lovecslev/seed-data
      - run: npm run db:generate --workspace=@lovecslev/api
        env:
          DATABASE_URL: postgresql://lovecslev:lovecslev@localhost:5432/lovecslev
      - run: npm run build --workspace=@lovecslev/api
      - name: Apply migrations, seed twice, verify counts + SQL search
        run: npm run db:verify --workspace=@lovecslev/api
